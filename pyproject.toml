[project]
name = "claw-idea-jam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jack Arthur Harrhy", email = "me@jackharrhy.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.103.1",
    "fastapi>=0.136.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.29",
    "sqlalchemy>=2.0.49",
    "sse-starlette>=3.4.4",
    "uvicorn[standard]>=0.47.0",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "idea_jam"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
