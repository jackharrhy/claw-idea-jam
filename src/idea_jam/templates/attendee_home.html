{% extends "base.html" %}
{% block title %}Idea Jam — what would you point an agent at?{% endblock %}
{% block body %}
<main class="max-w-2xl mx-auto px-6 py-10">

  <h1 class="text-3xl font-semibold mb-2">what would you point an agent at?</h1>
  <p class="text-neutral-600 mb-8">In your life or work. Anything. Be specific.</p>

  <form hx-post="/ideas" hx-target="#your-ideas" hx-swap="outerHTML" hx-on::after-request="if(event.detail.successful) this.reset()" class="space-y-3">
    <textarea name="text" rows="3" maxlength="500" required
      class="w-full border border-neutral-300 rounded p-3 text-base focus:outline-none focus:ring focus:ring-neutral-400"
      placeholder="An agent that..."></textarea>
    <div class="flex justify-between items-center text-sm">
      <span class="text-neutral-500">
        you are
        <input type="text" name="display_name" value="{{ participant.display_name }}" maxlength="64"
               hx-post="/me/rename" hx-trigger="change" hx-swap="none"
               class="font-mono inline-block bg-transparent border-b border-transparent hover:border-neutral-300 focus:border-neutral-400 focus:outline-none" />
      </span>
      <button class="px-4 py-2 bg-neutral-900 text-white rounded">submit</button>
    </div>
  </form>

  <section class="mt-10">
    <h2 class="text-sm font-semibold uppercase tracking-wide text-neutral-500 mb-2">your ideas so far</h2>
    {% include "partials/your_ideas_list.html" %}
  </section>
</main>
{% endblock %}
