{% extends "base.html" %}
{% block title %}moderator · idea jam{% endblock %}
{% block body %}
<main class="max-w-md mx-auto px-6 py-20">
  <h1 class="text-2xl font-semibold mb-6">moderator</h1>
  {% if error %}
    <p class="mb-4 text-rose-700 text-sm">{{ error }}</p>
  {% endif %}
  <form action="/m/login" method="post" class="space-y-3">
    <input type="password" name="token" required autofocus
           class="w-full border border-neutral-300 rounded p-3 text-base font-mono focus:outline-none focus:ring focus:ring-neutral-400"
           placeholder="moderator token" />
    <button class="w-full px-4 py-2 bg-neutral-900 text-white rounded">log in</button>
  </form>
</main>
{% endblock %}
